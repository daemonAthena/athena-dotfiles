# Text editors
$textEditor = mousepad
windowrulev2 = float, class:^($textEditor)$
windowrulev2 = size 700 400, class:^($textEditor)$
windowrulev2 = move onscreen cursor 30% -45%, class:^($textEditor)$

# File Manager
$fileManager = Thunar
windowrule = float,^($fileManager)$
windowrulev2 = size 35% 65%, class:^($fileManager)$
windowrulev2 = animation popin,class:^($fileManager)$
windowrulev2 = opacity 0.8 0.8,class:^($fileManager)$
windowrulev2 = move onscreen 0% 0%, class:^($fileManager)$

# Calendar
$calendar = thunderbird
windowrulev2 = float,class:^($calendar)$
windowrulev2 = size 90% 65%, class:^($calendar)$
windowrulev2 = animation popin,class:^($calendar)$
windowrulev2 = opacity 0.8 0.8,class:^($calendar)$
windowrulev2 = move onscreen 5% 10%, class:^($calendar)$

# Obsidian
windowrulev2 = opacity 0.7 0.7,class:^(obsidian)$

# Calculator
$calculator = org.gnome.Calculator
windowrulev2 = opacity 0.7 0.7,class:^($calculator)$
windowrulev2 = float,class:^($calculator)$
windowrulev2 = size 20% 45%,class:^($calculator)$
windowrulev2 = animation popin,class:^($calculator)$
windowrulev2 = move onscreen 80% 0%, class:^($calculator)$

# Video Viewer
$video = mpv
windowrulev2 = float,class:^($video)$
